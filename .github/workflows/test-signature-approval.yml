name: test-signature-approval

on: [pull_request]

permissions:
  # This workflow executes PR-supplied tests and parser code. Keep it separate
  # from the privileged pull_request_target gate and never grant write access.
  contents: read

jobs:
  regression-tests:
    name: Approval gate regression tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    # The scope decision reads only Git trees, never PR code. It fails safe: an
    # unreadable change set, an unknown path or a declared-incomplete list keeps
    # the suite running. There is no allow-list of paths that must run, only a
    # deny-list of paths that provably cannot change an approval verdict.
    - name: Determine approval regression scope
      id: scope
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        $colPath = @()
        $blnComplete = $false
        try {
          $baseSha = '${{ github.event.pull_request.base.sha }}'
          $headSha = '${{ github.event.pull_request.head.sha }}'
          if ($baseSha -and $headSha) {
            git fetch --no-tags --depth=1 origin $baseSha 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              # --no-renames reports both sides of a rename as separate paths, so a
              # rename out of build/ cannot hide behind its new location.
              $colPath = @(git diff --name-only --no-renames FETCH_HEAD HEAD 2>$null)
              if ($LASTEXITCODE -eq 0) { $blnComplete = $true }
            }
          }
        } catch {
          Write-Output "Scope probe failed: $_"
        }
        $colArg = @{ FromStdin = $true }
        if ($blnComplete) { $colArg['ChangeSetComplete'] = $true }
        $colPath | ./build/Test-ApprovalRegressionScope.ps1 @colArg
        if ($LASTEXITCODE -ne 0) { throw 'Approval regression scope decision failed' }
    - name: Confirm no-work result
      if: steps.scope.outputs.run != 'true'
      shell: pwsh
      run: |
        Write-Output 'Approval regression suite skipped: no changed path is an input of the suite.'
        Write-Output 'This job still reports success so the workflow never disappears silently.'
    - uses: actions/setup-node@v4
      if: steps.scope.outputs.run == 'true'
      with:
        node-version: 24
    - name: Run approval regression tests
      if: steps.scope.outputs.run == 'true'
      run: node --test build/signature-approval.test.cjs build/Get-SignatureDelta.test.cjs build/internal-hook-approval.test.cjs build/test-file-approval.test.cjs
