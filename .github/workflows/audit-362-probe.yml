name: audit-362-probe

# Measurement probe for issue #362 (checkout and runner alternatives).
# Not part of PR validation. Push-triggered on one audit branch so each push is
# exactly one sample of every variant, in the same minute, on the same input.

on:
  push:
    branches: [audit/362-runners]

permissions:
  contents: read

env:
  AUDIT_BASE_SHA: d98b30f1023c85f7d2121e1eb32d67143a1cf669
  AUDIT_HEAD_SHA: d54c93b42830c4e5b22c2f544b41e004146234db

jobs:
  full-win:
    name: probe full history windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Plan
      shell: pwsh
      run: |
        ./build/Get-PRValidationPlan.ps1 -BaseSha $env:AUDIT_BASE_SHA -HeadSha $env:AUDIT_HEAD_SHA -OutputPath plan.json
        $p = Get-Content -Raw plan.json | ConvertFrom-Json
        Write-Host "AUDIT-SCOPE scope=$($p.Scope)"
        "variant=full-win scope=$($p.Scope)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

  anc-win:
    name: probe ancestry-limited windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Ancestry-limited fetch
      shell: pwsh
      run: |
        git fetch --no-tags --no-recurse-submodules origin `
          "+$env:AUDIT_BASE_SHA`:refs/remotes/audit/base" `
          "+$env:AUDIT_HEAD_SHA`:refs/remotes/audit/head"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git rev-list --count refs/remotes/audit/head
    - name: Plan
      shell: pwsh
      run: |
        ./build/Get-PRValidationPlan.ps1 -BaseSha $env:AUDIT_BASE_SHA -HeadSha $env:AUDIT_HEAD_SHA -OutputPath plan.json
        $p = Get-Content -Raw plan.json | ConvertFrom-Json
        Write-Host "AUDIT-SCOPE scope=$($p.Scope)"
        "variant=anc-win scope=$($p.Scope)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

  shallow-win:
    name: probe shallow windows expected failure
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Shallow fetch of the two commits
      shell: pwsh
      run: |
        git fetch --no-tags --depth=1 --no-recurse-submodules origin `
          "+$env:AUDIT_BASE_SHA`:refs/remotes/audit/base" `
          "+$env:AUDIT_HEAD_SHA`:refs/remotes/audit/head"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Plan, expected to fail on merge-base
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        $planExit = 0
        try { ./build/Get-PRValidationPlan.ps1 -BaseSha $env:AUDIT_BASE_SHA -HeadSha $env:AUDIT_HEAD_SHA -OutputPath plan.json }
        catch { $planExit = 1; Write-Host "PLAN-THREW $($_.Exception.Message)" }
        if (Test-Path plan.json) { $planExit = 0 }
        $mb = (git merge-base $env:AUDIT_BASE_SHA $env:AUDIT_HEAD_SHA 2>&1 | Out-String).Trim()
        $mbExit = $LASTEXITCODE
        Write-Host "AUDIT-SHALLOW merge-base-exit=$mbExit plan-produced=$([bool](Test-Path plan.json)) error=[$mb]"
        "variant=shallow-win merge-base-exit=$mbExit plan-produced=$([bool](Test-Path plan.json))" |
          Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
        if (Test-Path plan.json) { throw 'Shallow checkout unexpectedly produced a plan; the variant is not disproved.' }
        # git merge-base exited non-zero above; that is the predicted outcome and
        # the assertion is the two recorded values, so do not fail the job on it.
        exit 0

  full-ubuntu:
    name: probe full history ubuntu
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Plan
      shell: pwsh
      run: |
        ./build/Get-PRValidationPlan.ps1 -BaseSha $env:AUDIT_BASE_SHA -HeadSha $env:AUDIT_HEAD_SHA -OutputPath plan.json
        $p = Get-Content -Raw plan.json | ConvertFrom-Json
        Write-Host "AUDIT-SCOPE scope=$($p.Scope)"
        "variant=full-ubuntu scope=$($p.Scope)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
