# Measurement prototype for audit issue #356 / #359. Not for merge.
#
# Purpose: measure whether removing the `changes` scope gate from consumer jobs
# (per-job scope evaluation) recovers the modelled scheduling headroom.
#
# Relationship to .github/workflows/validate.yml:
#   - same nine jobs, same step bodies, same runner labels;
#   - `changes` is retained as the single plan authority, but no consumer needs it;
#   - every consumer evaluates the plan itself and either runs its suite or exits
#     with an explicit, reportable no-work outcome (ran=false);
#   - the terminal gate is the UNCHANGED build/Invoke-ValidationResultGate.ps1, fed
#     job results derived fail-closed in the result job (see below), so no gate
#     policy is reimplemented.
#
# Driven by workflow_dispatch so the measured run graph does not depend on a pull
# request diff: the workflow file lives on its own branch and every job checks out
# inputs.head_sha, so the plan is computed over exactly the same base->head range
# as the baseline sample it is paired with.
name: validate-359

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Pull-request base commit (same value as the paired baseline run)
        required: true
      head_sha:
        description: Pull-request head commit (same value as the paired baseline run)
        required: true
      label:
        description: Shape label used only for concurrency grouping
        required: true

permissions:
  contents: read

concurrency:
  group: validate-359-${{ inputs.label }}
  cancel-in-progress: false

jobs:
  lint:
    name: PS1 lint (vendored prek hooks, changed files)
    runs-on: windows-latest
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      ACTIONLINT_VERSION: v1.7.7
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.head_sha }}
        fetch-depth: 0
    - name: Check generated-file ownership
      shell: pwsh
      run: ./build/Test-GeneratedTouch.ps1 -BaseRef $env:BASE_SHA
    - name: Determine lint scope
      id: lint_scope
      shell: pwsh
      env:
        BASE_SHA: ${{ inputs.base_sha }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        ./build/Get-CiLintPlan.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA -OutputPath lint-plan.json
        $plan = Get-Content -Raw lint-plan.json | ConvertFrom-Json
        $cheap = @($plan.CheapFiles).Count -gt 0
        $powershell = @($plan.PowerShellFiles).Count -gt 0
        $workflows = @($plan.WorkflowFiles).Count -gt 0
        $hooks = $cheap -or $powershell
        "cheap=$($cheap.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        "powershell=$($powershell.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        "workflows=$($workflows.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        "hooks=$($hooks.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
    - name: Restore pinned PSScriptAnalyzer
      if: steps.lint_scope.outputs.powershell == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-${{ runner.os }}-lint-v1-${{ hashFiles('build/ModuleCacheRequirements.json') }}
        restore-keys: |
          pwsh-modules-${{ runner.os }}-lint-v1-
    - name: Ensure pinned PSScriptAnalyzer
      if: steps.lint_scope.outputs.powershell == 'true'
      shell: pwsh
      run: ./build/Install-RequiredModules.ps1 -Set lint
    - name: Restore pinned prek
      if: steps.lint_scope.outputs.hooks == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}\prek
        key: prek-${{ runner.os }}-${{ hashFiles('build/ToolCacheRequirements.json') }}
    - name: Ensure pinned prek
      if: steps.lint_scope.outputs.hooks == 'true'
      shell: pwsh
      run: |
        ./build/Install-Prek.ps1 -TargetPath (Join-Path $env:RUNNER_TEMP 'prek')
        Join-Path (Join-Path $env:RUNNER_TEMP 'prek') 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Lint changed files with cheap hooks
      if: steps.lint_scope.outputs.cheap == 'true'
      shell: pwsh
      run: |
        $plan = Get-Content -Raw lint-plan.json | ConvertFrom-Json
        $files = @($plan.CheapFiles)
        & prek run check-merge-conflict trailing-whitespace end-of-file-fixer check-json check-yaml --config prek.toml --files @files
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Lint changed PowerShell files
      if: steps.lint_scope.outputs.powershell == 'true'
      shell: pwsh
      env:
        PS1_LINT_CHECK_ONLY: '1'
      run: |
        $plan = Get-Content -Raw lint-plan.json | ConvertFrom-Json
        $files = @($plan.PowerShellFiles)
        & prek run ps1-lint --config prek.toml --files @files
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Restore pinned actionlint
      if: steps.lint_scope.outputs.workflows == 'true'
      id: actionlint_cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}\actionlint
        key: actionlint-${{ runner.os }}-${{ env.ACTIONLINT_VERSION }}
    - name: Install pinned actionlint
      if: steps.lint_scope.outputs.workflows == 'true' && steps.actionlint_cache.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        GOBIN: ${{ runner.temp }}\actionlint
      run: go install "github.com/rhysd/actionlint/cmd/actionlint@$env:ACTIONLINT_VERSION"
    - name: Lint touched workflow files
      if: steps.lint_scope.outputs.workflows == 'true'
      shell: pwsh
      run: |
        $plan = Get-Content -Raw lint-plan.json | ConvertFrom-Json
        $files = @($plan.WorkflowFiles | ForEach-Object { (Resolve-Path -LiteralPath $_).Path })
        $actionlint = Join-Path $env:RUNNER_TEMP 'actionlint/actionlint.exe'
        if (-not (Test-Path -LiteralPath $actionlint)) { throw 'The pinned actionlint binary was not restored or installed.' }
        & $actionlint @files
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Retained only as the plan authority for the unchanged result gate. Nothing
  # needs it, so its duration is fully overlapped instead of on the critical path.
  changes:
    name: Determine validation scope
    runs-on: windows-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      module_tests: ${{ steps.scope.outputs.module_tests }}
      analyzer_scans: ${{ steps.scope.outputs.analyzer_scans }}
      selective_tests: ${{ steps.scope.outputs.selective_tests }}
      compiled_import: ${{ steps.scope.outputs.compiled_import }}
      infrastructure: ${{ steps.scope.outputs.infrastructure }}
      plan_hash: ${{ steps.scope.outputs.plan_hash }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.head_sha }}
        fetch-depth: 0
    - name: Determine changes against PR base
      id: scope
      shell: pwsh
      env:
        BASE_SHA: ${{ inputs.base_sha }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        ./build/Get-PRValidationPlan.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA -OutputPath validation-plan.json
        $plan = Get-Content -Raw validation-plan.json | ConvertFrom-Json
        if ([string]::IsNullOrWhiteSpace($plan.Scope)) { throw 'Invalid validation scope' }
        $flag = [ordered]@{
          module_tests   = $plan.ModuleTests
          analyzer_scans = $plan.AnalyzerScans
          selective_tests = $plan.SelectiveTests
          compiled_import = $plan.CompiledImport
          infrastructure = $plan.InfrastructureChange
        }
        foreach ($itemName in $flag.Keys) {
          if ($flag[$itemName] -isnot [bool]) { throw "Invalid $itemName flag" }
          "$itemName=$($flag[$itemName].ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        }
        "scope=$($plan.Scope)" >> $env:GITHUB_OUTPUT
        "plan_hash=$((Get-FileHash -LiteralPath validation-plan.json -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT

  general-unit-tests:
    name: Validate General Unit Tests
    runs-on: windows-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      plan_hash: ${{ steps.scope.outputs.plan_hash }}
      ran: ${{ steps.scope.outputs.ran }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.head_sha }}
        fetch-depth: 0
    - name: Evaluate scope for this job
      id: scope
      shell: pwsh
      env:
        BASE_SHA: ${{ inputs.base_sha }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        ./build/Get-PRValidationPlan.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA -OutputPath validation-plan.json
        $plan = Get-Content -Raw validation-plan.json | ConvertFrom-Json
        $ran = [bool]$plan.ModuleTests
        "ran=$($ran.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        "scope=$($plan.Scope)" >> $env:GITHUB_OUTPUT
        "plan_hash=$((Get-FileHash -LiteralPath validation-plan.json -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT
        Write-Host "This job is required by scope '$($plan.Scope)': $ran"
    - name: Restore PowerShell modules
      if: steps.scope.outputs.ran == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-${{ runner.os }}-base-v2-${{ hashFiles('build/ModuleCacheRequirements.json') }}
        restore-keys: |
          pwsh-modules-${{ runner.os }}-base-v2-
    - name: Ensure prerequisites
      if: steps.scope.outputs.ran == 'true'
      shell: pwsh
      run: ./build/Install-RequiredModules.ps1 -Set base
    - name: Validate
      if: steps.scope.outputs.ran == 'true'
      shell: pwsh
      run: build/vsts-validate-v2.ps1 -TestGeneral $true -TestFunctions $false -Exclude "PSScriptAnalyzer.Tests.ps1"

  infrastructure-tests:
    name: Validate Infrastructure Regression Tests
    runs-on: windows-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      plan_hash: ${{ steps.scope.outputs.plan_hash }}
      ran: ${{ steps.scope.outputs.ran }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.head_sha }}
        fetch-depth: 0
    - name: Evaluate scope for this job
      id: scope
      shell: pwsh
      env:
        BASE_SHA: ${{ inputs.base_sha }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        ./build/Get-PRValidationPlan.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA -OutputPath validation-plan.json
        $plan = Get-Content -Raw validation-plan.json | ConvertFrom-Json
        $ran = [bool]$plan.InfrastructureChange
        "ran=$($ran.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        "scope=$($plan.Scope)" >> $env:GITHUB_OUTPUT
        "plan_hash=$((Get-FileHash -LiteralPath validation-plan.json -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT
        Write-Host "This job is required by scope '$($plan.Scope)': $ran"
    - name: Restore PowerShell modules
      if: steps.scope.outputs.ran == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-${{ runner.os }}-base-v2-${{ hashFiles('build/ModuleCacheRequirements.json') }}
        restore-keys: |
          pwsh-modules-${{ runner.os }}-base-v2-
    - name: Ensure prerequisites
      if: steps.scope.outputs.ran == 'true'
      shell: pwsh
      run: ./build/Install-RequiredModules.ps1 -Set base
    - name: Run infrastructure regression suites
      if: steps.scope.outputs.ran == 'true'
      shell: pwsh
      run: ./build/Invoke-InfrastructureValidation.ps1

  public-functions-unit-tests:
    name: Validate Public Functions using PSScriptAnalyzer Unit Tests
    runs-on: windows-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      plan_hash: ${{ steps.scope.outputs.plan_hash }}
      ran: ${{ steps.scope.outputs.ran }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.head_sha }}
        fetch-depth: 0
    - name: Evaluate scope for this job
      id: scope
      shell: pwsh
      env:
        BASE_SHA: ${{ inputs.base_sha }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        ./build/Get-PRValidationPlan.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA -OutputPath validation-plan.json
        $plan = Get-Content -Raw validation-plan.json | ConvertFrom-Json
        $ran = [bool]$plan.AnalyzerScans
        "ran=$($ran.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        "scope=$($plan.Scope)" >> $env:GITHUB_OUTPUT
        "plan_hash=$((Get-FileHash -LiteralPath validation-plan.json -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT
        Write-Host "This job is required by scope '$($plan.Scope)': $ran"
    - name: Restore PowerShell modules
      if: steps.scope.outputs.ran == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-${{ runner.os }}-base-v2-${{ hashFiles('build/ModuleCacheRequirements.json') }}
        restore-keys: |
          pwsh-modules-${{ runner.os }}-base-v2-
    - name: Ensure prerequisites
      if: steps.scope.outputs.ran == 'true'
      shell: pwsh
      run: ./build/Install-RequiredModules.ps1 -Set base
    - name: Validate
      if: steps.scope.outputs.ran == 'true'
      shell: pwsh
      run: build/vsts-validate-psscriptanalyzer.ps1 -TestPublic $true -TestInternal $false

  internal-functions-unit-tests:
    name: Validate Internal Functions using PSScriptAnalyzer Unit Tests
    runs-on: windows-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      plan_hash: ${{ steps.scope.outputs.plan_hash }}
      ran: ${{ steps.scope.outputs.ran }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.head_sha }}
        fetch-depth: 0
    - name: Evaluate scope for this job
      id: scope
      shell: pwsh
      env:
        BASE_SHA: ${{ inputs.base_sha }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        ./build/Get-PRValidationPlan.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA -OutputPath validation-plan.json
        $plan = Get-Content -Raw validation-plan.json | ConvertFrom-Json
        $ran = [bool]$plan.AnalyzerScans
        "ran=$($ran.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        "scope=$($plan.Scope)" >> $env:GITHUB_OUTPUT
        "plan_hash=$((Get-FileHash -LiteralPath validation-plan.json -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT
        Write-Host "This job is required by scope '$($plan.Scope)': $ran"
    - name: Restore PowerShell modules
      if: steps.scope.outputs.ran == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-${{ runner.os }}-base-v2-${{ hashFiles('build/ModuleCacheRequirements.json') }}
        restore-keys: |
          pwsh-modules-${{ runner.os }}-base-v2-
    - name: Ensure prerequisites
      if: steps.scope.outputs.ran == 'true'
      shell: pwsh
      run: ./build/Install-RequiredModules.ps1 -Set base
    - name: Validate
      if: steps.scope.outputs.ran == 'true'
      shell: pwsh
      run: build/vsts-validate-psscriptanalyzer.ps1 -TestPublic $false -TestInternal $true

  selective-tests:
    name: Validate Relevant Tests
    runs-on: windows-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      plan_hash: ${{ steps.scope.outputs.plan_hash }}
      ran: ${{ steps.scope.outputs.ran }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.head_sha }}
        fetch-depth: 0
    - name: Evaluate scope for this job
      id: scope
      shell: pwsh
      env:
        BASE_SHA: ${{ inputs.base_sha }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        ./build/Get-PRValidationPlan.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA -OutputPath validation-plan.json
        $plan = Get-Content -Raw validation-plan.json | ConvertFrom-Json
        $ran = [bool]$plan.SelectiveTests
        "ran=$($ran.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        "scope=$($plan.Scope)" >> $env:GITHUB_OUTPUT
        "plan_hash=$((Get-FileHash -LiteralPath validation-plan.json -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT
        Write-Host "This job is required by scope '$($plan.Scope)': $ran"
    - name: Restore PowerShell modules
      if: steps.scope.outputs.ran == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-${{ runner.os }}-base-v2-${{ hashFiles('build/ModuleCacheRequirements.json') }}
        restore-keys: |
          pwsh-modules-${{ runner.os }}-base-v2-
    - name: Ensure prerequisites
      if: steps.scope.outputs.ran == 'true'
      shell: pwsh
      run: ./build/Install-RequiredModules.ps1 -Set base
    - name: Validate
      if: steps.scope.outputs.ran == 'true'
      shell: pwsh
      run: ./build/Invoke-SelectiveValidation.ps1 -PlanPath validation-plan.json

  compiled-import:
    name: Validate Compiled Module Import
    runs-on: windows-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      plan_hash: ${{ steps.scope.outputs.plan_hash }}
      ran: ${{ steps.scope.outputs.ran }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.head_sha }}
        fetch-depth: 0
    - name: Evaluate scope for this job
      id: scope
      shell: pwsh
      env:
        BASE_SHA: ${{ inputs.base_sha }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        ./build/Get-PRValidationPlan.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA -OutputPath validation-plan.json
        $plan = Get-Content -Raw validation-plan.json | ConvertFrom-Json
        $ran = [bool]$plan.CompiledImport
        "ran=$($ran.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        "scope=$($plan.Scope)" >> $env:GITHUB_OUTPUT
        "plan_hash=$((Get-FileHash -LiteralPath validation-plan.json -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT
        Write-Host "This job is required by scope '$($plan.Scope)': $ran"
    - name: Restore PowerShell modules
      if: steps.scope.outputs.ran == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-${{ runner.os }}-base-v2-${{ hashFiles('build/ModuleCacheRequirements.json') }}
        restore-keys: |
          pwsh-modules-${{ runner.os }}-base-v2-
    - name: Ensure prerequisites
      if: steps.scope.outputs.ran == 'true'
      shell: pwsh
      run: ./build/Install-RequiredModules.ps1 -Set base
    - name: Validate
      if: steps.scope.outputs.ran == 'true'
      shell: pwsh
      run: ./build/Test-CompiledImport.ps1
    - name: Validate behavioral tests
      if: steps.scope.outputs.ran == 'true'
      shell: pwsh
      run: ./build/Test-Behavior.ps1

  result:
    name: Validate Individual Unit Tests
    if: always()
    needs: [lint, changes, general-unit-tests, public-functions-unit-tests, internal-functions-unit-tests, infrastructure-tests, selective-tests, compiled-import]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.head_sha }}
    - name: Derive fail-closed outcomes
      id: outcome
      shell: pwsh
      env:
        LINT_R: ${{ needs.lint.result }}
        CHANGE_R: ${{ needs.changes.result }}
        GENERAL_R: ${{ needs.general-unit-tests.result }}
        GENERAL_RAN: ${{ needs.general-unit-tests.outputs.ran }}
        PUBLIC_R: ${{ needs.public-functions-unit-tests.result }}
        PUBLIC_RAN: ${{ needs.public-functions-unit-tests.outputs.ran }}
        INTERNAL_R: ${{ needs.internal-functions-unit-tests.result }}
        INTERNAL_RAN: ${{ needs.internal-functions-unit-tests.outputs.ran }}
        INFRA_R: ${{ needs.infrastructure-tests.result }}
        INFRA_RAN: ${{ needs.infrastructure-tests.outputs.ran }}
        SELECTIVE_R: ${{ needs.selective-tests.result }}
        SELECTIVE_RAN: ${{ needs.selective-tests.outputs.ran }}
        COMPILED_R: ${{ needs.compiled-import.result }}
        COMPILED_RAN: ${{ needs.compiled-import.outputs.ran }}
      run: |
        # A job that did not conclude 'success' keeps its own conclusion. A job that
        # concluded success maps to 'success' when it reported ran=true and to
        # 'skipped' when it reported ran=false. A missing ran value maps to 'missing'
        # so the unchanged gate fails closed instead of reading absent as skipped.
        function ConvertTo-Reported([string] $Result, [string] $Ran) {
          if ($Result -cne 'success') { return $Result }
          if ($Ran -ceq 'true') { return 'success' }
          if ($Ran -ceq 'false') { return 'skipped' }
          return 'missing'
        }
        "lint=$(ConvertTo-Reported $env:LINT_R 'true')" >> $env:GITHUB_OUTPUT
        "change=$(ConvertTo-Reported $env:CHANGE_R 'true')" >> $env:GITHUB_OUTPUT
        "general=$(ConvertTo-Reported $env:GENERAL_R $env:GENERAL_RAN)" >> $env:GITHUB_OUTPUT
        "public=$(ConvertTo-Reported $env:PUBLIC_R $env:PUBLIC_RAN)" >> $env:GITHUB_OUTPUT
        "internal=$(ConvertTo-Reported $env:INTERNAL_R $env:INTERNAL_RAN)" >> $env:GITHUB_OUTPUT
        "infrastructure=$(ConvertTo-Reported $env:INFRA_R $env:INFRA_RAN)" >> $env:GITHUB_OUTPUT
        "selective=$(ConvertTo-Reported $env:SELECTIVE_R $env:SELECTIVE_RAN)" >> $env:GITHUB_OUTPUT
        "compiled=$(ConvertTo-Reported $env:COMPILED_R $env:COMPILED_RAN)" >> $env:GITHUB_OUTPUT
    - name: Verify all required jobs ran and passed
      shell: pwsh
      env:
        LINT: ${{ steps.outcome.outputs.lint }}
        CHANGE_RESULT: ${{ steps.outcome.outputs.change }}
        SCOPE: ${{ needs.changes.outputs.scope }}
        MODULE_TESTS: ${{ needs.changes.outputs.module_tests }}
        ANALYZER_SCANS: ${{ needs.changes.outputs.analyzer_scans }}
        SELECTIVE_TESTS: ${{ needs.changes.outputs.selective_tests }}
        COMPILED_IMPORT: ${{ needs.changes.outputs.compiled_import }}
        INFRASTRUCTURE: ${{ needs.changes.outputs.infrastructure }}
        PLAN_HASH: ${{ needs.changes.outputs.plan_hash }}
        SELECTIVE_HASH: ${{ needs.selective-tests.outputs.plan_hash }}
        COMPILED_HASH: ${{ needs.compiled-import.outputs.plan_hash }}
        SELECTIVE_SCOPE: ${{ needs.selective-tests.outputs.scope }}
        COMPILED_SCOPE: ${{ needs.compiled-import.outputs.scope }}
        GENERAL: ${{ steps.outcome.outputs.general }}
        PUBLIC: ${{ steps.outcome.outputs.public }}
        INTERNAL: ${{ steps.outcome.outputs.internal }}
        INFRASTRUCTURE_RESULT: ${{ steps.outcome.outputs.infrastructure }}
        SELECTIVE: ${{ steps.outcome.outputs.selective }}
        COMPILED: ${{ steps.outcome.outputs.compiled }}
      run: |
        ./build/Invoke-ValidationResultGate.ps1 `
          -Lint $env:LINT `
          -ChangeResult $env:CHANGE_RESULT `
          -Scope $env:SCOPE `
          -ModuleTests $env:MODULE_TESTS `
          -AnalyzerScans $env:ANALYZER_SCANS `
          -SelectiveTests $env:SELECTIVE_TESTS `
          -CompiledImport $env:COMPILED_IMPORT `
          -InfrastructureChange $env:INFRASTRUCTURE `
          -PlanHash $env:PLAN_HASH `
          -SelectiveHash $env:SELECTIVE_HASH `
          -CompiledHash $env:COMPILED_HASH `
          -SelectiveScope $env:SELECTIVE_SCOPE `
          -CompiledScope $env:COMPILED_SCOPE `
          -General $env:GENERAL `
          -Public $env:PUBLIC `
          -Internal $env:INTERNAL `
          -Selective $env:SELECTIVE `
          -Compiled $env:COMPILED `
          -InfrastructureResult $env:INFRASTRUCTURE_RESULT
